<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Gasbayar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #1d4ed8;
        color: #fff;
        font-weight: 700;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 14px;
        max-width: 300px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <!--
      Offline fallback shell. When the device is online, Capacitor loads the
      live web app from the URL configured in capacitor.config.ts and this page
      is not shown. This appears only if the server can't be reached.
    -->
    <div class="wrap">
      <div class="logo">G</div>
      <h1>Gasbayar</h1>
      <p>
        Menghubungkan ke server… Pastikan perangkat Anda terhubung ke internet.
      </p>
    </div>
  </body>
</html>
