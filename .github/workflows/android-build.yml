name: Build Android APK

# Builds a debug APK of the Gasbayar Android shell (Capacitor wrapping the live
# Vercel web app) and uploads it as a downloadable artifact.
#
# Trigger it automatically on pushes that touch native/Capacitor files, or
# manually from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public-shell/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 requires Node >= 22.
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the deprecated legacy 'tools' package (removed from the SDK
          # repos), which makes the action's default install fail. We install
          # nothing extra here and let Gradle fetch exactly what it needs.
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        # Regenerates the ignored generated files (web assets, plugin config)
        # into the native project before building.
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gasbayar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
